version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  except:
    # Stream RPCs answer with semantic messages (DesiredState, Command,
    # LogChunk) rather than *Response wrappers, the same shape xDS uses.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - WIRE_JSON
