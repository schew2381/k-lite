# Every v* tag becomes a GitHub Release carrying the cross-built binaries,
# their checksums, join.sh, and the built web board, plus a multi-arch
# klite-net image on ghcr (ADR 0038). The binaries job never waits on the
# UI build, so a flaky board build can't hold back the binaries a joining
# node needs.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release
      - name: create the release with binaries, checksums, and join.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/* hack/join.sh

  # The donor image every node runs (klited --net-image pins the tag).
  # buildx sets TARGETARCH per platform for the Dockerfile's COPY.
  image:
    runs-on: ubuntu-latest
    # A job-level permissions block zeroes every scope it omits, and
    # actions/checkout still needs contents: read.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-build klite-net for both linux arches
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/klite-net-linux-amd64 ./cmd/klite-net
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/klite-net-linux-arm64 ./cmd/klite-net
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/klite-net.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/schew2381/klite-net:${{ github.ref_name }}

  # The built board. Self-hosters serve it straight from klite-facade
  # (--ui-dir), no dev server. It attaches once the release exists.
  ui:
    # This job is best-effort: the board tarball is a convenience asset, and a
    # frontend type error must not paint the whole release red (the binaries
    # and the donor image are the release).
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make ui
      - name: attach the built board to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C frontend/dist -czf "klite-ui-$GITHUB_REF_NAME.tar.gz" .
          gh release upload "$GITHUB_REF_NAME" "klite-ui-$GITHUB_REF_NAME.tar.gz"
