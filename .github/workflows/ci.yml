name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go tool buf lint && go tool buf format --diff --exit-code
      - run: go build ./...
      - run: go test -race -count=1 -timeout 5m -shuffle=on ./...
      - run: go mod verify
      - name: tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
