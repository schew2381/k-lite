syntax = "proto3";

package klite.v1;

import "klite/v1/objects.proto";

option go_package = "github.com/schew2381/k-lite/internal/gen/klitev1;klitev1";

// AgentService is agent-initiated only. The server never dials a node (ADR 0004).
service AgentService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc WatchDesired(WatchDesiredRequest) returns (stream DesiredState);
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  rpc StreamCommands(StreamCommandsRequest) returns (stream Command);
  rpc PushCommandOutput(stream CommandOutput) returns (PushCommandOutputResponse);
}

message RegisterRequest {
  string node = 1;
  string cluster_token = 2; // join secret; optional when the caller holds a node cert
  bytes csr_pem = 3; // join CSR; the response returns it signed (ADR 0013)
  // Machine address other nodes dial for this node's ingress ports (ADR
  // 0024), when the agent already knows it as a literal IP. Hostnames
  // resolve later, against the donor, and arrive via ReportStatus instead.
  string advertise_address = 4;
}

message NetBootstrap {
  string subnet = 1; // 10.44.0.0/16
  string klite_net_ip = 2; // 10.44.0.10 + node_index
  string vip_range = 3; // 10.44.64.0/18
  int32 node_index = 4;
  // Cluster identity and per-cluster host-port bases (M8). Infra containers
  // carry cluster_id as a label so one cluster never evicts another's donors,
  // and the bases keep two deliberate clusters off each other's admin ports.
  string cluster_id = 5;
  int32 net_admin_port_base = 6; // 0 means the 19000 default
  int32 envoy_admin_port_base = 7; // 0 means the 19500 default
  // Cross-node ingress range (ADR 0034): the donor publishes host ports
  // [base + per_node*(index-1), base + per_node*index) at creation. Both
  // arrive resolved; zero means the server predates M9 and no range exists.
  int32 ingress_port_base = 8;
  int32 ingress_ports_per_node = 9;
  // Image the donor container runs, set by klited's --net-image so every
  // node agrees on one version (ADR 0038). Empty keeps the agent's
  // compiled-in default, klite-net:dev, which is what dev clusters and
  // pre-M11 servers produce.
  string net_image = 10;
}

message RegisterResponse {
  string node_token = 1; // pre-mTLS credential
  bytes cert_pem = 2; // M8
  bytes ca_pem = 3; // M8
  NetBootstrap net = 4;
}

message WatchDesiredRequest {
  string node = 1;
  int64 last_applied_revision = 2; // resume point after reconnect
}

message DesiredState {
  int64 revision = 1;
  repeated Instance instances = 2; // full snapshot for this node
  NetDesired net = 3;
}

message ServiceVIP {
  string service = 1;
  string vip = 2; // this node's VIP for the service (ADR 0006)
  int32 port = 3;
  int32 target_port = 4;
}

enum EndpointHealth {
  ENDPOINT_HEALTH_UNSPECIFIED = 0;
  ENDPOINT_HEALTH_READY = 1;
  ENDPOINT_HEALTH_DRAINING = 2;
}

message Endpoint {
  string ip = 1;
  int32 port = 2;
  string node = 3; // consumers compare it to their own name: remote endpoints dial ingress (ADR 0034)
  EndpointHealth health = 4;
  // How OTHER nodes reach this endpoint: the owning node's advertised IP
  // and its mTLS ingress port. The owning node keeps dialing ip:port raw.
  int32 ingress_port = 5;
  string machine_address = 6;
}

message EndpointGroup {
  string service = 1;
  repeated Endpoint endpoints = 2;
}

// The policy table arrives pre-resolved so klite-net and Envoy RBAC
// never need to see raw NetworkPolicy objects.
message CompiledPolicy {
  PolicyAction action = 1;
  string from = 2;
  string to = 3;
  repeated string except = 4;
  string policy_name = 5;
}

message NetDesired {
  repeated ServiceVIP services = 1;
  repeated EndpointGroup endpoints = 2;
  map<string, string> ip_identity = 3; // instance IP -> service name
  repeated CompiledPolicy policies = 4;
  // What this node's klite-net should TCP-probe: its own instances.
  repeated ProbeTarget probe_targets = 5;
  // This node's mTLS ingress listeners (ADR 0034), one per local
  // allocated endpoint. Driven by allocations rather than endpoint
  // health, so the listener is up well before any consumer routes to it
  // and stays up while the endpoint drains.
  repeated IngressListener ingress_listeners = 6;
}

// IngressListener is one 0.0.0.0:<port> mTLS listener on the node's Envoy,
// forwarding to a local instance (ADR 0034).
message IngressListener {
  string service = 1; // names the listener, ingress/<service>/<port>
  int32 port = 2; // host-published ingress port from the node's slice
  string pod_ip = 3;
  int32 target_port = 4;
}

message ProbeTarget {
  string instance = 1;
  string ip = 2;
  int32 port = 3;
}

message InstanceStatusUpdate {
  string name = 1;
  string uid = 2;
  InstanceStatus status = 3;
}

message KliteNetStatus {
  bool healthy = 1;
  int32 admin_port = 2; // 127.0.0.1-published admin port on the host
}

// Unary on purpose: a client stream would hide send failures until the
// next Recv (research/grpc-go.md). Doubles as the 5s heartbeat.
message ReportStatusRequest {
  string node = 1;
  repeated InstanceStatusUpdate instances = 2;
  KliteNetStatus klite_net = 3;
  // Resolved advertise IP (ADR 0034), once the agent knows it. Hostname
  // flags resolve against the donor's /etc/hosts, which exists only after
  // the infra pod converges — later than Register. Empty leaves the stored
  // value alone.
  string advertise_address = 4;
  // The index this agent's infra actually runs, from its Register-time
  // NetBootstrap. When apply recreates a node record after delete churn
  // (ADR 0042), the server restores the missing index from this field, and
  // it never overwrites a set one. Zero means the agent predates this field.
  int32 node_index = 5;
}

message ReportStatusResponse {}

message StreamCommandsRequest {
  string node = 1;
}

message LogsCommand {
  string instance = 1;
  bool follow = 2;
  int32 tail = 3;
}

message StopCommand {
  string command_id = 1;
}

message Command {
  string id = 1;
  oneof cmd {
    LogsCommand logs = 2;
    StopCommand stop = 3;
  }
}

// One client-stream per command, correlated by command_id.
message CommandOutput {
  string command_id = 1;
  bytes data = 2;
  bool eof = 3;
}

message PushCommandOutputResponse {}
