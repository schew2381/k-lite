apiVersion: klite/v1
kind: Workload
metadata:
  name: a
  labels:
    app: a
spec:
  replicas: 1
  template:
    labels:
      app: a
    containers:
      - name: web
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        # This is the chatty shape, shared byte-for-byte with dialog-created
        # services (frontend/app/lib/yamlgen.ts chattyContainer): each
        # instance serves its hostname on :80 and calls one random name from
        # TARGETS through the real data path (kdns, VIP, Envoy). Calls fire
        # in waves: every instance sleeps to the same 10-second wall-clock
        # boundary, then rolls one die. 16384 of 65536 is 25%, the per-wave
        # equivalent of the old 2.5% per second. sh as pid 1 drops SIGTERM by
        # default, so the trap comes first, and the sleep runs backgrounded
        # under wait, where a trap can fire. Both together let drains and
        # orphan sweeps finish in a second instead of the full grace period.
        # The folded block below must parse to the exact string the frontend
        # generates, every line break sitting where the generator writes '; '.
        args:
          - >-
            trap "exit 0" TERM; mkdir -p /www;
            echo "$(hostname) is a" > /www/index.html;
            httpd -p 80 -h /www;
            while :; do sleep $((10 - $(date +%s) % 10)) & wait $!;
            r=$(head -c2 /dev/urandom | od -An -tu2 | tr -d " ");
            [ "$r" -lt 16384 ] || continue;
            n=0; for t in $TARGETS; do n=$((n+1)); done;
            [ "$n" -gt 0 ] || continue;
            k=$(( ($(head -c2 /dev/urandom | od -An -tu2 | tr -d " ") % n) + 1 ));
            i=0; for t in $TARGETS; do i=$((i+1)); [ "$i" = "$k" ] && pick=$t; done;
            wget -q -T 2 -O- "http://$pick:8080" >/dev/null 2>&1 && echo "-> $pick ok" || echo "-> $pick FAILED";
            done
        env:
          - name: TARGETS
            value: b c d
        ports:
          - containerPort: 80
        readinessProbe:
          tcpPort: 80
---
apiVersion: klite/v1
kind: Service
metadata:
  name: a
spec:
  selector:
    app: a
  port: 8080
  targetPort: 80
