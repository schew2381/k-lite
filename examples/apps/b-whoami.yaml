apiVersion: klite/v1
kind: Workload
metadata:
  name: b
  labels:
    app: b
spec:
  replicas: 2
  template:
    labels:
      app: b
    containers:
      - name: web
        image: traefik/whoami:v1.10
        env:
          - name: WHOAMI_NAME
            value: b
        ports:
          - containerPort: 80
        readinessProbe:
          tcpPort: 80
---
apiVersion: klite/v1
kind: Service
metadata:
  name: b
spec:
  selector:
    app: b
  port: 8080
  targetPort: 80
