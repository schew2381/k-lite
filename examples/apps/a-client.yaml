apiVersion: klite/v1
kind: Workload
metadata:
  name: a
  labels:
    app: a
spec:
  replicas: 1
  template:
    labels:
      app: a
    containers:
      - name: web
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        # The chatty shape, shared with dialog-created services (see
        # frontend/app/lib/yamlgen.ts chattyContainer): serve this instance's
        # hostname on :80, and once a second roll two urandom bytes. A roll
        # under 1638 of 65536 (2.5%) wgets one random name from TARGETS through
        # the real data path (kdns, VIP, Envoy). sh as pid 1 drops SIGTERM
        # by default, so the TERM trap lets drains and orphan sweeps finish
        # in a second instead of the full grace period.
        args:
          - |
            trap "exit 0" TERM
            mkdir -p /www
            echo "$(hostname) is a" > /www/index.html
            httpd -p 80 -h /www
            while sleep 1; do
              r=$(head -c2 /dev/urandom | od -An -tu2 | tr -d " ")
              [ "$r" -lt 1638 ] || continue
              n=0; for t in $TARGETS; do n=$((n+1)); done
              [ "$n" -gt 0 ] || continue
              k=$(( ($(head -c2 /dev/urandom | od -An -tu2 | tr -d " ") % n) + 1 ))
              i=0; for t in $TARGETS; do i=$((i+1)); [ "$i" = "$k" ] && pick=$t; done
              wget -q -T 2 -O- "http://$pick:8080" >/dev/null 2>&1 && echo "-> $pick ok" || echo "-> $pick FAILED"
            done
        env:
          - name: TARGETS
            value: b c d
        ports:
          - containerPort: 80
        readinessProbe:
          tcpPort: 80
---
apiVersion: klite/v1
kind: Service
metadata:
  name: a
spec:
  selector:
    app: a
  port: 8080
  targetPort: 80
