apiVersion: klite/v1
kind: Workload
metadata:
  name: a
  labels:
    app: a
spec:
  replicas: 1
  template:
    labels:
      app: a
    containers:
      - name: client
        image: alpine:3.20
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do
              rb=$(wget -qO- -T 2 http://b:8080 2>&1 | grep -m1 Hostname || echo "b FAILED")
              rc=$(wget -qO- -T 2 http://c:8080 2>&1 | grep -m1 Hostname || echo "c FAILED")
              echo "$(date +%T) b => $rb | c => $rc"
              sleep 1
            done
---
apiVersion: klite/v1
kind: Service
metadata:
  name: a
spec:
  selector:
    app: a
  port: 8080
  targetPort: 80
