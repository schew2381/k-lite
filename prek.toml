# prek runs these checks (https://github.com/j178/prek). See docs/adr/0031.
# Hooks receive staged file paths only and must stay fast. Nothing in this file
# rewrites Go code. The heavy gates keep their make targets and run in CI.
# Install the commit hook in single-session clones only: a commit-time run
# stashes unstaged edits, and in a shared checkout the stash opens a data-loss
# window for every other session. In a shared checkout, run the set through
# `make precommit` instead.
exclude = '^(internal/gen/|frontend/node_modules/|frontend/dist/|frontend/bun\.lock$|\.claude/)'

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-merge-conflict" },
    { id = "check-yaml", args = ["--allow-multiple-documents"] },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-check"
name = "biome check --write (frontend)"
language = "system"
entry = '''bash -c 'cd frontend && exec bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true "${@#frontend/}"' --'''
files = '^frontend/.*\.(ts|tsx|js|jsx|json|css)$'

[[repos.hooks]]
id = "gofmt-check"
name = "gofmt (check only, never rewrites)"
language = "system"
entry = '''bash -c 'out="$(gofmt -l "$@")"; rc=$?; if [ -n "$out" ] || [ "$rc" -ne 0 ]; then printf "gofmt wants to reformat:\n%s\n" "$out"; exit 1; fi' --'''
types = ["go"]
exclude = '^internal/gen/'
